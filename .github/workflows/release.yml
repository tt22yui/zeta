name: release

# 打 v* 格式标签时触发发布构建；也可在 Actions 页面手动触发
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 发布到 GitHub Releases 需要内容写入权限
permissions:
  contents: write

jobs:
  # 标签发布前的质量闸门：前端类型检查。
  # 说明：Linux 上跑 cargo test 需要 webkit2gtk/librsvg 等系统依赖，未安装会直接失败，
  # 因此 ubuntu 只做类型检查，后端测试交给无需额外系统库的 Windows runner（见 verify-backend）。
  verify:
    runs-on: ubuntu-latest
    # 校验只读取代码，收窄顶层 contents: write
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 前端类型检查
        run: npx tsc --noEmit

  # 后端测试：Windows runner 自带 WebView2，无需额外系统依赖
  verify-backend:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 依赖缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: 安装前端依赖
        run: npm ci

      # tauri::generate_context! 在编译期读取 frontendDist（../dist），缺失会导致编译失败
      - name: 构建前端（供 generate_context! 读取）
        run: npm run build

      - name: 后端测试
        working-directory: src-tauri
        run: cargo test

  build-and-publish:
    # 质量闸门：类型检查与后端测试都通过后才构建发布，避免把红灯状态打上标签发出去
    needs: [verify, verify-backend]
    strategy:
      # macOS 构建偶尔超时，避免一个平台失败拖垮全部
      fail-fast: false
      matrix:
        include:
          # macOS 产 Apple Silicon (M1/M2/M3) dmg
          - {
              platform: macos-latest,
              rust_target: "aarch64-apple-darwin",
              bundle_args: "-- --target aarch64-apple-darwin",
              release_files: "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg",
            }
          - {
              platform: windows-latest,
              bundle_args: "-- --no-bundle",
              release_files: "src-tauri/target/release/bundle/zip/Zeta-win64-*.zip",
            }
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust（stable）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - name: Rust 依赖缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri"

      - name: 安装前端依赖
        run: npm ci

      # 显式调用项目本地已安装的 CLI，避免 tauri-action 隔离环境找不到 tauri
      - name: 构建前端 + Rust + 打包
        run: npm run tauri build ${{ matrix.bundle_args }}

      # Windows 官方 bundle 无 zip；这里把 --no-bundle 产出的 exe 压成 ZIP（解压即用）
      - name: 打包 Windows 绿色版 ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/target/release/bundle/zip | Out-Null
          Compress-Archive `
            -Path src-tauri/target/release/zeta.exe `
            -DestinationPath "src-tauri/target/release/bundle/zip/Zeta-win64-${{ github.ref_name }}.zip"
          Get-Item "src-tauri/target/release/bundle/zip/*.zip" | Select-Object Name, Length

      # 上传产物到与 tag 同名的 Release，直接发布
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Zeta ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: ${{ matrix.release_files }}